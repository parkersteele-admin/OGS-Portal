name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).apiKey }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).authDomain }}
          VITE_FIREBASE_PROJECT_ID: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).projectId }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).storageBucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).messagingSenderId }}
          VITE_FIREBASE_APP_ID: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).appId }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_APP_ENV: production

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}

      - name: Deploy Firebase Hosting (live channel)
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
          projectId: ${{ fromJson(secrets.VITE_FIREBASE_CONFIG).projectId }}
          channelId: live

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project production --non-interactive

      - name: Deploy Firestore Security Rules
        run: npx firebase-tools deploy --only firestore:rules --project production --non-interactive

      - name: Write deployment summary
        if: success()
        run: |
          echo "## ✅ Production Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Live URL** | ${{ steps.hosting.outputs.details_url }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production deploy failed — ${context.sha.slice(0, 7)}`,
              body: [
                '## Production deployment failed',
                '',
                `A deployment to **production** triggered by @${context.actor} has failed.`,
                '',
                '| | |',
                '|---|---|',
                `| **Commit** | \`${context.sha}\` |`,
                `| **Branch** | \`${context.ref}\` |`,
                `| **Workflow run** | [View logs](${runUrl}) |`,
              ].join('\n'),
              labels: ['bug', 'deployment'],
            });
