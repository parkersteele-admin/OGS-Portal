<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Ohio Gas Supply logo</title>
  <desc id="logo-desc">OGS dark wordmark with Ohio Gas Supply text and blue to orange gradient stripes.</desc>
  <defs>
    <linearGradient id="logo-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="58%" stop-color="#00B7FF" />
      <stop offset="74%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>

  <!-- Main OGS text (large, left side) -->
  <g fill="#0A1B33" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-style="italic" font-weight="900">
    <text x="40" y="240" font-size="320" letter-spacing="8">OGS</text>
  </g>

  <!-- Right side: OHIO, GAS, SUPPLY stacked -->
  <g fill="#0A1B33" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-style="italic" font-weight="700">
    <text x="920" y="120" font-size="80" letter-spacing="2">OHIO</text>
    <text x="900" y="210" font-size="80" letter-spacing="2">GAS</text>
    <text x="800" y="310" font-size="110" letter-spacing="2">SUPPLY</text>
  </g>

  <!-- Gradient stripes (full width, below text) -->
  <path d="M 30 340 L 1370 340 L 1350 370 L 10 370 Z" fill="url(#logo-stripe)" />
  <path d="M 40 295 L 1380 295 L 1360 325 L 20 325 Z" fill="url(#logo-stripe)" />
  <path d="M 50 250 L 1390 250 L 1370 280 L 30 280 Z" fill="url(#logo-stripe)" />
</svg>
