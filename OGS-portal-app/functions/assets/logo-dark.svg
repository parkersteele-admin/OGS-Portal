<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Ohio Gas Supply logo</title>
  <desc id="logo-desc">OGS dark wordmark with Ohio Gas Supply stacked text and blue to orange speed lines.</desc>
  <defs>
    <linearGradient id="logo-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="58%" stop-color="#00B7FF" />
      <stop offset="74%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>

  <g fill="#0A1B33" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-style="italic" font-weight="700">
    <text x="28" y="176" font-size="180" letter-spacing="2">OGS</text>
    <text x="680" y="92" font-size="70">OHIO</text>
    <text x="660" y="168" font-size="70">GAS</text>
    <text x="598" y="252" font-size="96">SUPPLY</text>
  </g>

  <path d="M24 206 L676 206 L660 224 L98 224 Z" fill="url(#logo-stripe)" />
  <path d="M26 237 L916 237 L904 255 L165 255 Z" fill="url(#logo-stripe)" />
  <path d="M0 268 L906 268 L894 286 L46 286 Z" fill="url(#logo-stripe)" />
</svg>
