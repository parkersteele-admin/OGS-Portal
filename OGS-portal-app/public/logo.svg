<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Ohio Gas Supply logo</title>
  <desc id="logo-desc">OGS wordmark with Ohio Gas Supply stacked text and blue to orange speed lines.</desc>
  <defs>
    <linearGradient id="logo-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="58%" stop-color="#00B7FF" />
      <stop offset="74%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>
  <g fill="#0A1B33">
    <text x="34" y="172" font-family="Arial Black, Arial, sans-serif" font-size="178" font-style="italic" font-weight="900" letter-spacing="-12" transform="skewX(-12)">OGS</text>
    <text x="707" y="98" font-family="Arial Black, Arial, sans-serif" font-size="62" font-style="italic" font-weight="900" transform="skewX(-12)">OHIO</text>
    <text x="688" y="172" font-family="Arial Black, Arial, sans-serif" font-size="62" font-style="italic" font-weight="900" transform="skewX(-12)">GAS</text>
    <text x="633" y="246" font-family="Arial Black, Arial, sans-serif" font-size="82" font-style="italic" font-weight="900" transform="skewX(-12)">SUPPLY</text>
  </g>
  <path d="M23 206 L679 206 L663 224 L95 224 Z" fill="url(#logo-stripe)" />
  <path d="M26 237 L914 237 L902 255 L163 255 Z" fill="url(#logo-stripe)" />
  <path d="M0 268 L904 268 L892 286 L45 286 Z" fill="url(#logo-stripe)" />
</svg>
