<svg viewBox="0 0 1252.17 494.6" xmlns="http://www.w3.org/2000/svg">
  <title>OGS Horizontal White Logo</title>
  <g fill="white">
    <!-- OGS left mark -->
    <text x="50" y="280" font-family="Arial, sans-serif" font-size="200" font-weight="bold" letter-spacing="-8">OGS</text>
  </g>
  <g fill="white">
    <!-- Stacked right text -->
    <text x="650" y="150" font-family="Arial, sans-serif" font-size="90" font-weight="bold">OHIO</text>
    <text x="650" y="250" font-family="Arial, sans-serif" font-size="90" font-weight="bold">GAS</text>
    <text x="530" y="350" font-family="Arial, sans-serif" font-size="110" font-weight="bold">SUPPLY</text>
  </g>
  <!-- Gradient stripes at bottom -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0068ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="400" width="1252.17" height="30" fill="url(#grad1)"/>
  <rect x="0" y="430" width="1252.17" height="25" fill="url(#grad1)"/>
  <rect x="0" y="460" width="1252.17" height="34.6" fill="url(#grad1)"/>
</svg>
