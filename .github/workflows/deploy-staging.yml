name: Deploy to Firebase Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OGS-portal-app/package-lock.json

      - name: Install dependencies
        working-directory: OGS-portal-app
        run: npm ci

      - name: Build Vite app (staging)
        working-directory: OGS-portal-app
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: npm run build

      - name: Prepare Firebase auth (staging)
        env:
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          if [ -z "$FIREBASE_AUTH_SECRET" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_STAGING secret" >&2
            exit 1
          fi

          if [[ "$FIREBASE_AUTH_SECRET" == \{* ]]; then
            echo "$FIREBASE_AUTH_SECRET" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_CLI_TOKEN=" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_CLI_TOKEN=$FIREBASE_AUTH_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Firebase Hosting preview channel
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            npx firebase-tools hosting:channel:deploy preview --project ogs-portal --token "$FIREBASE_CLI_TOKEN"
          else
            npx firebase-tools hosting:channel:deploy preview --project ogs-portal
          fi

      - name: Deploy Firebase Functions (if changed)
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            npx firebase-tools deploy --only functions --project ogs-portal --token "$FIREBASE_CLI_TOKEN"
          else
            npx firebase-tools deploy --only functions --project ogs-portal
          fi

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            // Add logic to comment preview URL on related PR
            // Placeholder: replace with actual implementation
            console.log('Preview URL commented on PR');
