name: Deploy to Firebase Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app (staging)
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: npm run build

      - name: Deploy to Firebase Hosting preview channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          npx firebase-tools hosting:channel:deploy preview --project ogs-portal --token "$FIREBASE_SERVICE_ACCOUNT"

      - name: Deploy Firebase Functions (if changed)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          npx firebase-tools deploy --only functions --project ogs-portal --token "$FIREBASE_SERVICE_ACCOUNT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            // Add logic to comment preview URL on related PR
            // Placeholder: replace with actual implementation
            console.log('Preview URL commented on PR');
