name: Deploy to Firebase Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'ogs-portal' }}
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      FIREBASE_SERVICE_ACCOUNT_PRODUCTION: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_SERVICE_ACCOUNT_OGS_PORTAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OGS_PORTAL }}
      FIREBASE_TOKEN_PRODUCTION: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OGS-portal-app/package-lock.json

      - name: Install dependencies
        working-directory: OGS-portal-app
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            if npm ci --legacy-peer-deps --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts." >&2
              exit 1
            fi
            echo "npm ci failed on attempt $attempt. Retrying..." >&2
            sleep 15
          done

      - name: Prepare frontend env (production)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const githubEnv = process.env.GITHUB_ENV
          const legacyRaw = process.env.VITE_FIREBASE_CONFIG || ''
          let legacy = {}

          if (legacyRaw.trim()) {
            try {
              legacy = JSON.parse(legacyRaw)
            } catch (error) {
              console.error('VITE_FIREBASE_CONFIG exists but is not valid JSON.')
              process.exit(1)
            }
          }

          const values = {
            VITE_FIREBASE_API_KEY: process.env.VITE_FIREBASE_API_KEY || legacy.apiKey || '',
            VITE_FIREBASE_AUTH_DOMAIN: process.env.VITE_FIREBASE_AUTH_DOMAIN || legacy.authDomain || '',
            VITE_FIREBASE_PROJECT_ID: process.env.VITE_FIREBASE_PROJECT_ID || legacy.projectId || process.env.FIREBASE_PROJECT_ID || '',
            VITE_FIREBASE_STORAGE_BUCKET: process.env.VITE_FIREBASE_STORAGE_BUCKET || legacy.storageBucket || '',
            VITE_FIREBASE_MESSAGING_SENDER_ID: process.env.VITE_FIREBASE_MESSAGING_SENDER_ID || legacy.messagingSenderId || '',
            VITE_FIREBASE_APP_ID: process.env.VITE_FIREBASE_APP_ID || legacy.appId || '',
            VITE_STRIPE_PUBLISHABLE_KEY: process.env.VITE_STRIPE_PUBLISHABLE_KEY || '',
            VITE_GOOGLE_MAPS_API_KEY: process.env.VITE_GOOGLE_MAPS_API_KEY || '',
            VITE_APP_ENV: 'production',
          }

          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_STORAGE_BUCKET',
            'VITE_FIREBASE_MESSAGING_SENDER_ID',
            'VITE_FIREBASE_APP_ID',
          ]

          const missing = required.filter((key) => !values[key])
          if (missing.length > 0) {
            console.error(`Missing frontend Firebase env for production build: ${missing.join(', ')}`)
            process.exit(1)
          }

          fs.appendFileSync(
            githubEnv,
            Object.entries(values)
              .map(([key, value]) => `${key}=${String(value).replace(/\n/g, '')}`)
              .join('\n') + '\n',
          )
          NODE

      - name: Build Vite app (production)
        working-directory: OGS-portal-app
        run: npm run build

      - name: Install Functions dependencies
        working-directory: OGS-portal-app/functions
        run: npm ci --no-audit --no-fund

      - name: Build Firebase Functions
        working-directory: OGS-portal-app/functions
        run: npm run build

      - name: Prepare Firebase auth inputs
        id: firebase-auth
        run: |
          SERVICE_ACCOUNT_JSON=""
          FIREBASE_AUTH_SECRET=""

          if [ -n "$FIREBASE_SERVICE_ACCOUNT_PRODUCTION" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_PRODUCTION"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_OGS_PORTAL" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_OGS_PORTAL"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "$FIREBASE_TOKEN_PRODUCTION" ]; then
            FIREBASE_AUTH_SECRET="$FIREBASE_TOKEN_PRODUCTION"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            FIREBASE_AUTH_SECRET="$FIREBASE_TOKEN"
          fi

          if [ -z "$SERVICE_ACCOUNT_JSON" ] && [ -z "$FIREBASE_AUTH_SECRET" ]; then
            echo "Missing Firebase deploy auth secret. Set one of: FIREBASE_SERVICE_ACCOUNT_PRODUCTION, FIREBASE_SERVICE_ACCOUNT_OGS_PORTAL, FIREBASE_SERVICE_ACCOUNT, FIREBASE_TOKEN_PRODUCTION, FIREBASE_TOKEN." >&2
            exit 1
          fi

          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            {
              echo "FIREBASE_SERVICE_ACCOUNT_JSON<<EOF"
              echo "$SERVICE_ACCOUNT_JSON"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "has_service_account=true" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_CLI_TOKEN=" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_AUTH_SECRET" ]; then
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_CLI_TOKEN=$FIREBASE_AUTH_SECRET" >> "$GITHUB_ENV"
          else
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase-auth.outputs.has_service_account == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting live channel
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Set SendGrid API key in Firebase secrets
        working-directory: OGS-portal-app
        run: |
          printf '%s' "${{ secrets.SENDGRID_API_KEY }}" | firebase functions:secrets:set SENDGRID_API_KEY --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Firebase Functions
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Deploy Firestore security rules
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Notify on success/failure
        uses: actions/github-script@v8
        with:
          script: |
            // Add logic to notify on success/failure
            // Placeholder: replace with actual implementation
            console.log('Deployment notification sent');
