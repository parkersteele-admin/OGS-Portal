name: Deploy to Firebase Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app (production)
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: npm run build

      - name: Deploy to Firebase Hosting live channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          npx firebase-tools deploy --only hosting --project ogs-portal --token "$FIREBASE_SERVICE_ACCOUNT"

      - name: Deploy Firebase Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          npx firebase-tools deploy --only functions --project ogs-portal --token "$FIREBASE_SERVICE_ACCOUNT"

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          npx firebase-tools deploy --only firestore:rules --project ogs-portal --token "$FIREBASE_SERVICE_ACCOUNT"

      - name: Notify on success/failure
        uses: actions/github-script@v7
        with:
          script: |
            // Add logic to notify on success/failure
            // Placeholder: replace with actual implementation
            console.log('Deployment notification sent');
