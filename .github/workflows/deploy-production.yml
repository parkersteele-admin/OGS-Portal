name: Deploy to Firebase Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_PRODUCTION: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN_PRODUCTION: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OGS-portal-app/package-lock.json

      - name: Install dependencies
        working-directory: OGS-portal-app
        run: npm ci --legacy-peer-deps

      - name: Build Vite app (production)
        working-directory: OGS-portal-app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Prepare Firebase auth inputs
        id: firebase-auth
        run: |
          SERVICE_ACCOUNT_JSON=""
          FIREBASE_AUTH_SECRET=""

          if [ -n "$FIREBASE_SERVICE_ACCOUNT_PRODUCTION" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_PRODUCTION"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "$FIREBASE_TOKEN_PRODUCTION" ]; then
            FIREBASE_AUTH_SECRET="$FIREBASE_TOKEN_PRODUCTION"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            FIREBASE_AUTH_SECRET="$FIREBASE_TOKEN"
          fi

          if [ -z "$SERVICE_ACCOUNT_JSON" ] && [ -z "$FIREBASE_AUTH_SECRET" ]; then
            echo "Missing Firebase deploy auth secret. Set one of: FIREBASE_SERVICE_ACCOUNT_PRODUCTION, FIREBASE_SERVICE_ACCOUNT, FIREBASE_TOKEN_PRODUCTION, FIREBASE_TOKEN." >&2
            exit 1
          fi

          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            {
              echo "FIREBASE_SERVICE_ACCOUNT_JSON<<EOF"
              echo "$SERVICE_ACCOUNT_JSON"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "has_service_account=true" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_CLI_TOKEN=" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_AUTH_SECRET" ]; then
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_CLI_TOKEN=$FIREBASE_AUTH_SECRET" >> "$GITHUB_ENV"
          else
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing VITE_FIREBASE_PROJECT_ID secret for deploy target." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase-auth.outputs.has_service_account == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting live channel
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Deploy Firebase Functions
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Deploy Firestore security rules
        working-directory: OGS-portal-app
        run: |
          if [ -n "$FIREBASE_CLI_TOKEN" ]; then
            firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_CLI_TOKEN" --non-interactive
          else
            firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Notify on success/failure
        uses: actions/github-script@v7
        with:
          script: |
            // Add logic to notify on success/failure
            // Placeholder: replace with actual implementation
            console.log('Deployment notification sent');
